version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # Keep the ESLint config package and its peers in one PR. Splitting them caused
      # @eslint/js@10 to arrive without eslint@10 and broke `npm ci`.
      # 将 ESLint 配置包与其 peer 依赖放在同一个 PR，避免再次出现只升级其中一个而破坏 `npm ci`。
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'eslint-config-prettier'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
