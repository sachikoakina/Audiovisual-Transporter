# Timed / manual sync: Douban RSS and Bangumi → configured destinations.
# 定时 / 手动同步：豆瓣 RSS 与 Bangumi → 各自配置的目标端。
name: sync

# Least privilege. This workflow only reads the repository and talks to external APIs; without an
# explicit block the token's permissions come from the repository default, which may be far broader
# than anything here needs.
# 最小权限。本工作流只读取仓库并与外部 API 通信；不显式声明时，令牌权限取自仓库默认设置，
# 可能远宽于这里的任何需要。
permissions:
  contents: read

# Never let two syncs overlap. A second run would race the first for `.cache/` state and could
# double-write to Notion / NeoDB / TMDB. `cancel-in-progress: false` is deliberate: cancelling a
# half-finished sync is worse than queueing the next one.
# 绝不让两次同步重叠。第二次运行会与第一次争用 `.cache/` 状态，并可能向 Notion / NeoDB / TMDB
# 重复写入。`cancel-in-progress: false` 是刻意的：中断一次做到一半的同步，比让下一次排队更糟。
concurrency:
  group: sync
  cancel-in-progress: false

on:
  workflow_dispatch: # manual trigger / 手动触发
    inputs:
      # Full re-import: lift SYNC_MAX_ITEMS / NEODB_MAX_PAGES and ignore SYNC_INCREMENTAL for this
      # run. Keeping the default `false` means a manual run for a quick check stays capped and cheap.
      # 全量重导：本次运行取消 SYNC_MAX_ITEMS / NEODB_MAX_PAGES 上限，并忽略 SYNC_INCREMENTAL。
      # 默认 `false` 让「手动跑一次做快速检查」仍然受封顶约束、开销可控。
      full_sync:
        description: 'NeoDB → TMDB full sync (no item/page caps, incremental off) — slow'
        type: boolean
        default: false
  schedule:
    # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events
    # Mon / Wed / Fri at 08:00 UTC. Three runs a week instead of one: the Douban RSS feed only
    # carries about ten entries, so a weekly run can miss a burst of marks made early in the week.
    # This narrows the loss window; it does not close it — entries still roll out after ten.
    # 每周一、三、五 08:00 UTC。每周三次而非一次：豆瓣 RSS 只保留约十条，一周跑一次可能漏掉周初
    # 集中标记的条目。这只是缩小丢失窗口，并不能消除它 —— 超过十条仍会滚出 feed。
    - cron: '0 8 * * 1,3,5'

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung network call would otherwise burn the default 360-minute budget. A capped cron run is
    # paced by NEODB_REQUEST_DELAY_MS / TMDB_REQUEST_DELAY_MS and bounded by SYNC_MAX_ITEMS /
    # NEODB_MAX_PAGES, so an hour is generous. A full import has no such bounds and runs at roughly
    # 0.6–1.0 s per item, so the manual full_sync run gets its own budget.
    # 否则一次卡住的网络调用会烧掉默认的 360 分钟额度。常规运行已受
    # NEODB_REQUEST_DELAY_MS / TMDB_REQUEST_DELAY_MS 节流，并由 SYNC_MAX_ITEMS / NEODB_MAX_PAGES
    # 封顶，一小时足够宽裕。全量导入没有这些上限，速度约 0.6–1.0 秒/条，因此手动全量单独给预算。
    timeout-minutes: ${{ inputs.full_sync && 180 || 60 }}

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/previous-releases
        # Node.js 支持周期见上方链接

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_MOVIE_DATABASE_ID: ${{ secrets.NOTION_MOVIE_DATABASE_ID }}
      NOTION_MUSIC_DATABASE_ID: ${{ secrets.NOTION_MUSIC_DATABASE_ID }}
      NOTION_BOOK_DATABASE_ID: ${{ secrets.NOTION_BOOK_DATABASE_ID }}
      NOTION_GAME_DATABASE_ID: ${{ secrets.NOTION_GAME_DATABASE_ID }}
      NOTION_DRAMA_DATABASE_ID: ${{ secrets.NOTION_DRAMA_DATABASE_ID }}
      DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
      NEODB_API_TOKEN: ${{ secrets.NEODB_API_TOKEN }}
      NEODB_VISIBILITY: ${{ vars.NEODB_VISIBILITY || '2' }}
      NEODB_BASE_URL: ${{ vars.NEODB_BASE_URL || 'https://neodb.social' }}
      NEODB_REQUEST_DELAY_MS: ${{ vars.NEODB_REQUEST_DELAY_MS || '300' }}
      NEODB_MAX_PAGES: ${{ vars.NEODB_MAX_PAGES || '10' }}
      DOUBAN_RSS_USER_AGENT: ${{ vars.DOUBAN_RSS_USER_AGENT || '' }}
      BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}
      BANGUMI_PRIVATE: ${{ vars.BANGUMI_PRIVATE || 'false' }}
      BANGUMI_COLLECTION_LIMIT: ${{ vars.BANGUMI_COLLECTION_LIMIT || '50' }}
      BANGUMI_USER_AGENT: ${{ vars.BANGUMI_USER_AGENT || '' }}
      BANGUMI_FULL_SYNC: ${{ vars.BANGUMI_FULL_SYNC || '0' }}
      SYNC_DOUBAN_NOTION: ${{ vars.SYNC_DOUBAN_NOTION || '0' }}
      SYNC_DOUBAN_NEODB: ${{ vars.SYNC_DOUBAN_NEODB || '1' }}
      SYNC_DOUBAN_BANGUMI: ${{ vars.SYNC_DOUBAN_BANGUMI || '1' }}
      SYNC_BANGUMI_NEODB: ${{ vars.SYNC_BANGUMI_NEODB || '1' }}
      SYNC_DOUBAN_NOTION_CATEGORIES: ${{ vars.SYNC_DOUBAN_NOTION_CATEGORIES || '' }}
      SYNC_DOUBAN_NEODB_CATEGORIES: ${{ vars.SYNC_DOUBAN_NEODB_CATEGORIES || '' }}
      SYNC_DOUBAN_BANGUMI_CATEGORIES: ${{ vars.SYNC_DOUBAN_BANGUMI_CATEGORIES || '' }}
      SYNC_BANGUMI_NEODB_CATEGORIES: ${{ vars.SYNC_BANGUMI_NEODB_CATEGORIES || '' }}
      SYNC_DOUBAN_NEODB_MERGE: ${{ vars.SYNC_DOUBAN_NEODB_MERGE || 'neodb_prefer' }}
      SYNC_BANGUMI_NEODB_MERGE: ${{ vars.SYNC_BANGUMI_NEODB_MERGE || 'neodb_prefer' }}
      SYNC_BANGUMI_NEODB_PROGRESS: ${{ vars.SYNC_BANGUMI_NEODB_PROGRESS || '0' }}

      # ── NeoDB → TMDB path ──────────────────────────────────────────────
      # Without these the whole path is skipped: SYNC_NEODB_TMDB defaults to
      # 0, so index.ts never enters the TMDB branch and exits 0 having done
      # nothing — a green run that writes no data.
      SYNC_NEODB_TMDB: ${{ vars.SYNC_NEODB_TMDB || '0' }}
      # The manual `full_sync` input wins; otherwise fall back to the Variables value (default 0).
      # 手动 `full_sync` 输入优先；否则取 Variables 的值（默认 0）。
      NEODB_TMDB_FULL_SYNC: ${{ inputs.full_sync && '1' || vars.NEODB_TMDB_FULL_SYNC || '0' }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      # Writes need a v3 session id or a user-scoped v4 token. A v4 *read*
      # token (scopes: api_read) authenticates reads but fails every write.
      TMDB_SESSION_ID: ${{ secrets.TMDB_SESSION_ID }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      TMDB_ACCOUNT_ID: ${{ vars.TMDB_ACCOUNT_ID || '' }}
      TMDB_LANGUAGE: ${{ vars.TMDB_LANGUAGE || 'zh-CN' }}
      TMDB_REQUEST_DELAY_MS: ${{ vars.TMDB_REQUEST_DELAY_MS || '300' }}
      TMDB_BASE_URL: ${{ vars.TMDB_BASE_URL || 'https://api.themoviedb.org/3' }}
      TMDB_INCLUDE_ADULT: ${{ vars.TMDB_INCLUDE_ADULT || 'false' }}
      SYNC_SHELF_TYPES: ${{ vars.SYNC_SHELF_TYPES || 'wishlist,progress,complete' }}
      SYNC_CATEGORIES: ${{ vars.SYNC_CATEGORIES || 'movie,tv' }}
      SYNC_RATING_PROFILE: ${{ vars.SYNC_RATING_PROFILE || 'tmdb_prefer' }}
      SYNC_YEAR_TOLERANCE: ${{ vars.SYNC_YEAR_TOLERANCE || '1' }}
      SYNC_MAX_ITEMS: ${{ vars.SYNC_MAX_ITEMS || '200' }}
      SYNC_DRY_RUN: ${{ vars.SYNC_DRY_RUN || '0' }}
      # Runners are ephemeral — no .cache/ survives between runs, so the
      # incremental state file is useless here. Fall back to TMDB-side
      # idempotency, which is safe and only costs extra read requests.
      SYNC_INCREMENTAL: ${{ vars.SYNC_INCREMENTAL || '0' }}
      SYNC_STATE_FILE: ${{ vars.SYNC_STATE_FILE || '.cache/sync-state.json' }}
      SYNC_UNMATCHED_LOG: ${{ vars.SYNC_UNMATCHED_LOG || '.cache/unmatched.json' }}

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # Gate the sync on the offline assertions. They need no credentials and no network, so they
      # cost seconds — and a rule that silently changed should stop the run before it writes
      # anything to Notion / NeoDB / TMDB.
      # 用离线断言给同步设门禁。它们不需要凭据也不需要网络，只需几秒；而规则若被悄悄改坏，
      # 应当**在**任何内容写入 Notion / NeoDB / TMDB 之前就把这一轮拦下来。
      - run: npm run verify:all || exit 1
      - run: npm run sync || exit 1
