<svg viewBox="0 0 680 442" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>五条同步链路及其对应开关</title>
<desc>豆瓣 RSS 经三个开关扇出至 Notion、NeoDB、Bangumi；Bangumi 经一个开关写入 NeoDB；NeoDB 经一个开关镜像至 TMDB。前四条为原有链路，最后一条为新增链路。</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="40" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="100" y="62" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#0C447C">豆瓣 RSS</text>

<path d="M100 84 L100 240" fill="none" stroke="#888780" stroke-width="1"/>

<path d="M100 100 L506 100" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#ah)"/>
<rect x="252" y="74" width="170" height="20" rx="4" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="337" y="84" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#444441">SYNC_DOUBAN_NOTION</text>

<path d="M100 170 L506 170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#ah)"/>
<rect x="252" y="144" width="170" height="20" rx="4" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="337" y="154" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#444441">SYNC_DOUBAN_NEODB</text>

<path d="M100 240 L506 240" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#ah)"/>
<rect x="252" y="214" width="170" height="20" rx="4" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="337" y="224" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#444441">SYNC_DOUBAN_BANGUMI</text>

<rect x="520" y="78" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="580" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#0C447C">Notion</text>

<rect x="520" y="148" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="580" y="170" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#0C447C">NeoDB</text>

<rect x="520" y="218" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="580" y="240" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#0C447C">Bangumi</text>

<rect x="40" y="308" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="100" y="330" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#0C447C">Bangumi</text>

<path d="M160 330 L506 330" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#ah)"/>
<rect x="252" y="304" width="170" height="20" rx="4" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="337" y="314" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#444441">SYNC_BANGUMI_NEODB</text>

<rect x="520" y="308" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="580" y="330" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#0C447C">NeoDB</text>

<rect x="40" y="378" width="120" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="100" y="400" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#04342C">NeoDB 书架</text>

<path d="M160 400 L506 400" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="252" y="374" width="170" height="20" rx="4" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
<text x="337" y="384" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#27500A">SYNC_NEODB_TMDB</text>

<rect x="520" y="378" width="120" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="580" y="400" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif" font-size="13" font-weight="500" fill="#27500A">TMDB</text>
</svg>
